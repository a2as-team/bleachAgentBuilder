variables:
  DEFAULT_MODEL:
    type: env
    params:
      caller: [os.environ, os.getenv]
      path: [agent_generator_with_config.config_schema]

files:
  ../.env:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../.env]
  agent_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  agent_path:
    type: literal
    actions: [read]
    params:
      caller: [Path(agent_dir)]
  config_file:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  config_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  file_path:
    type: variable
    actions: [write]
    params:
      caller: [file_path.write_text]
  generation_summary.json:
    type: literal
    actions: [read]
    params:
      caller: [generate_agent_code]
      path: [output_dir]
  output_base_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  output_dir:
    type: variable
    actions: [read, write]
    params:
      caller: [Path, output_dir.mkdir]
  output_path:
    type: literal
    actions: [read, write]
    params:
      caller: [Path(output_dir), output_path.mkdir]
  project_config.json:
    type: literal
    actions: [read]
    params:
      caller: [generate_agent_code]
      path: [output_dir]
  quick_start.py:
    type: literal
    actions: [read]
    params:
      caller: [generate_agent_code]
      path: [output_dir]
  quick_start_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  summary_path:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  test_dir:
    type: variable
    actions: [write]
    params:
      caller: [test_dir.mkdir]

networks:
  content:
    type: api
    actions: [GET]
    protocols: [http]
    params:
      caller: [_generate_agent_file]
      dynamic: "True"
      variable: content
